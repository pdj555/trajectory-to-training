<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Agent runs are labeled by their tests, then by a second check on hidden inputs. Honest runs become training data. A gamed run passes the tests and is turned away by the second check into Rejected."><title>Tests label the runs. A second check on hidden inputs turns the gamed run away; honest runs become training data.</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<path d="M220 84 H334" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M540 84 H654" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M860 84 H944" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M760 116 V210" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="20" y="52" width="200" height="64" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="120" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">Agent runs</text>
<text x="120" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="middle">code + test result</text>
<rect x="340" y="52" width="200" height="64" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="440" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">Tests</text>
<text x="440" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="middle">the usual label</text>
<rect x="660" y="52" width="200" height="64" rx="12" fill="#eceff2" stroke="#1f2328" stroke-width="1.6"/>
<text x="760" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">Second check</text>
<text x="760" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="middle">hidden inputs</text>
<rect x="950" y="52" width="200" height="64" rx="12" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="1050" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">Training data</text>
<text x="1050" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="middle">rows and pairs</text>
<rect x="660" y="216" width="200" height="64" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="760" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="middle">Rejected</text>
<text x="760" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#59636e" text-anchor="middle">kept out</text>
<circle r="8" fill="#1f2328" opacity="0">
<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.34;0.40;1" dur="10s" repeatCount="indefinite"/>
<animateMotion path="M120 84 H962" dur="10s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.30;1" keySplines="0.4 0 0.6 1;0 0 1 1" keyPoints="0;1;1"/>
</circle>
<g opacity="0">
<circle r="8" fill="none" stroke="#1f2328" stroke-width="2.4"/>
<text x="16" y="-12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#59636e">gamed</text>
<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.48;0.51;0.86;0.92;1" dur="10s" repeatCount="indefinite"/>
<animateMotion path="M120 84 H760 V216" dur="10s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.48;0.66;0.80;1" keySplines="0 0 1 1;0.4 0 0.6 1;0.4 0 0.6 1;0 0 1 1" keyPoints="0;0;0.829;1;1"/>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Agent runs are labeled by their tests, then by a second check on hidden inputs. Honest runs become training data. A gamed run passes the tests and is turned away by the second check into Rejected."><title>Tests label the runs. A second check on hidden inputs turns the gamed run away; honest runs become training data.</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs><path d="M220 84 H340" stroke="#6e7681" stroke-width="1.6" marker-end="url(#arr)"/><path d="M540 84 H660" stroke="#6e7681" stroke-width="1.6" marker-end="url(#arr)"/><path d="M860 84 H950" stroke="#6e7681" stroke-width="1.6" marker-end="url(#arr)"/><path d="M760 116 V216" stroke="#6e7681" stroke-width="1.6" marker-end="url(#arr)"/><circle r="7" fill="#e6edf3" opacity="0"><animateMotion dur="7s" begin="0s" repeatCount="indefinite" path="M220 84 H950" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"/><animate attributeName="opacity" dur="7s" begin="0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.04;0.46;0.52;1"/></circle><g opacity="0"><circle r="7" fill="none" stroke="#e6edf3" stroke-width="2.4"/><text x="14" y="-10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#9198a1">gamed</text><animateMotion dur="7s" begin="2.2s" repeatCount="indefinite" path="M220 84 H760 V248" keyPoints="0;1;1" keyTimes="0;0.55;1" calcMode="linear"/><animate attributeName="opacity" dur="7s" begin="2.2s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.04;0.51;0.57;1"/></g><circle r="7" fill="#e6edf3" opacity="0"><animateMotion dur="7s" begin="4.4s" repeatCount="indefinite" path="M220 84 H950" keyPoints="0;1;1" keyTimes="0;0.5;1" calcMode="linear"/><animate attributeName="opacity" dur="7s" begin="4.4s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.04;0.46;0.52;1"/></circle><rect x="20" y="52" width="200" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="120.0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e6edf3" text-anchor="middle">Agent runs</text><text x="120.0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9198a1" text-anchor="middle">code + test result</text><rect x="340" y="52" width="200" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="440.0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e6edf3" text-anchor="middle">Tests</text><text x="440.0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9198a1" text-anchor="middle">the usual label</text><rect x="660" y="52" width="200" height="64" rx="12" fill="#161b22" stroke="#e6edf3" stroke-width="2"/><text x="760.0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e6edf3" text-anchor="middle">Second check</text><text x="760.0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9198a1" text-anchor="middle">hidden inputs</text><rect x="950" y="52" width="200" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="1050.0" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e6edf3" text-anchor="middle">Training data</text><text x="1050.0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9198a1" text-anchor="middle">rows and pairs</text><rect x="660" y="216" width="200" height="64" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.2"/><text x="760.0" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#e6edf3" text-anchor="middle">Rejected</text><text x="760.0" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9198a1" text-anchor="middle">kept out</text></svg>
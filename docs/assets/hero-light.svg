<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="With tests as the label, 4 of 10 fine-tuning rows come from runs that gamed their tests. With a second check, 0.">
<title>With tests as the label, 4 of 10 fine-tuning rows come from runs that gamed their tests. With a second check, 0.</title>
<rect x="0.5" y="0.5" width="1199" height="559" rx="24" fill="#fcfcfb" stroke="#e6e5df"/>
<text x="80" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#898781" text-anchor="start" letter-spacing="0.2">trajectory-to-training</text>
<text x="80" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="-1.4">Cheating runs become training data.</text>
<text x="80" y="206" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#52514e" text-anchor="start" >Each square is a fine-tuning row. What passes the check becomes the next model.</text>
<text x="80" y="294" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#0b0b0b" text-anchor="start" >Tests as the label</text><rect x="380" y="258" width="48" height="48" rx="10" fill="#2a78d6"/><rect x="438" y="258" width="48" height="48" rx="10" fill="#2a78d6"/><rect x="496" y="258" width="48" height="48" rx="10" fill="#2a78d6"/><rect x="554" y="258" width="48" height="48" rx="10" fill="#2a78d6"/><rect x="612" y="258" width="48" height="48" rx="10" fill="#2a78d6"/><rect x="670" y="258" width="48" height="48" rx="10" fill="#2a78d6"/><rect x="728" y="258" width="48" height="48" rx="10" fill="#eb6834"/><rect x="786" y="258" width="48" height="48" rx="10" fill="#eb6834"/><rect x="844" y="258" width="48" height="48" rx="10" fill="#eb6834"/><rect x="902" y="258" width="48" height="48" rx="10" fill="#eb6834"/><text x="974" y="294" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start" >4 cheated</text><text x="80" y="390" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#0b0b0b" text-anchor="start" >Plus a second check</text><rect x="380" y="354" width="48" height="48" rx="10" fill="#2a78d6"/><rect x="438" y="354" width="48" height="48" rx="10" fill="#2a78d6"/><rect x="496" y="354" width="48" height="48" rx="10" fill="#2a78d6"/><rect x="554" y="354" width="48" height="48" rx="10" fill="#2a78d6"/><rect x="612" y="354" width="48" height="48" rx="10" fill="#2a78d6"/><rect x="670" y="354" width="48" height="48" rx="10" fill="#2a78d6"/><rect x="728" y="354" width="48" height="48" rx="10" fill="#e4e3dd"/><rect x="786" y="354" width="48" height="48" rx="10" fill="#e4e3dd"/><rect x="844" y="354" width="48" height="48" rx="10" fill="#e4e3dd"/><rect x="902" y="354" width="48" height="48" rx="10" fill="#e4e3dd"/><text x="974" y="390" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#0b0b0b" text-anchor="start" >0 cheated</text><text x="80" y="466" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#52514e" text-anchor="start" >Preference pairs with a cheating run as “chosen”:</text><text x="540" y="466" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start" >2 of 2  →  0 of 2</text><circle cx="86" cy="511" r="6" fill="#2a78d6"/><text x="100" y="516" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#898781" text-anchor="start" >honest run</text><circle cx="210" cy="511" r="6" fill="#eb6834"/><text x="224" y="516" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#898781" text-anchor="start" >run that gamed its tests</text><text x="1120" y="516" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#898781" text-anchor="end" >14 real runs, two tasks</text>
</svg>

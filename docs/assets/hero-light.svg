<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="With tests as the label, 4 of 10 fine-tuning rows come from gamed runs and both preference pairs choose a gamed run. A second check removes all 4.">
<title>With tests as the label, 4 of 10 fine-tuning rows come from gamed runs and both preference pairs choose a gamed run. A second check removes all 4.</title>
<rect x="0.5" y="0.5" width="1199" height="599" rx="20" fill="#fcfcfb" stroke="#e1e0d9"/>
<text x="72" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="2.4">TRAJECTORY-TO-TRAINING</text>
<text x="72" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="680" fill="#0b0b0b" text-anchor="start" letter-spacing="-0.8">What passes the check becomes the next model.</text>
<text x="72" y="194" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#52514e" text-anchor="start" >With tests as the only label, runs that cheat become training data.</text>
<text x="72" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#898781" text-anchor="start" letter-spacing="1.6">FINE-TUNING ROWS FROM 14 REAL RUNS</text><text x="72" y="313" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start" >Tests as the label</text><rect x="372" y="292" width="560" height="30" rx="4" fill="#ecebe6"/><rect x="372" y="292" width="335.0" height="30" rx="4" fill="#2a78d6"/><rect x="709.0" y="292" width="223.0" height="30" rx="4" fill="#eb6834"/><text x="952" y="314" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="650" fill="#0b0b0b" text-anchor="start" >6 honest, 4 gamed</text><text x="72" y="383" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#0b0b0b" text-anchor="start" >Tests plus a second check</text><rect x="372" y="362" width="560" height="30" rx="4" fill="#ecebe6"/><rect x="372" y="362" width="335.0" height="30" rx="4" fill="#2a78d6"/><text x="952" y="384" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#0b0b0b" text-anchor="start" >6 honest, 0 gamed</text><text x="372" y="456" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#898781" text-anchor="start" >Blue: honest runs.</text><text x="532" y="456" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#898781" text-anchor="start" >Orange: runs that gamed their tests.</text><line x1="72" y1="488" x2="1128" y2="488" stroke="#e1e0d9"/><text x="72" y="526" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#52514e" text-anchor="start" >Preference pairs with a gamed run as “chosen”</text><text x="632" y="526" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start" >2 of 2</text><text x="712" y="526" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#898781" text-anchor="start" >→</text><text x="748" y="526" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start" >0 of 2</text><text x="72" y="566" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#898781" text-anchor="start" >The second check compares each run with a reference on inputs the tests never use. It caught all 4 gamed runs.</text>
</svg>
